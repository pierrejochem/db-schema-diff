<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" role="img" aria-labelledby="t">
  <title id="t">DB Schema Diff</title>
  <!-- The lockup: the mark at 1024 scaled to the cap height of the wordmark beside it. Archivo is
       the display family in tokens.slint and is bundled with the application at 700 only; the
       fallbacks are what a machine without it will land on. -->
  <g transform="scale(0.3125)">
    <rect x="100" y="100" width="824" height="824" rx="180" fill="#1d2d3d"/>
    <rect x="503" y="300" width="18" height="424" rx="9" fill="#b5d9fd"/>
    <g fill="#ffffff">
      <rect x="192" y="312" width="292" height="96" rx="48"/>
      <rect x="192" y="464" width="292" height="96" rx="48"/>
      <rect x="192" y="616" width="292" height="96" rx="48"/>
      <rect x="540" y="312" width="292" height="96" rx="48"/>
      <rect x="540" y="616" width="292" height="96" rx="48"/>
    </g>
    <rect x="540" y="464" width="190" height="96" rx="48" fill="#b5d9fd"/>
  </g>
  <g font-family="Archivo, 'Helvetica Neue', Helvetica, sans-serif" font-weight="700">
    <text x="368" y="166" font-size="104" letter-spacing="-2" fill="#1d2d3d">DB</text>
    <text x="371" y="228" font-size="40" letter-spacing="5.6" fill="#5d5d60">SCHEMA DIFF</text>
  </g>
</svg>
