<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t">
  <title id="t">DB Schema Diff</title>
  <!-- One ink. The rows and the rule are knocked out of the ground rather than painted on it, so
       the mark survives a single-colour print, an embroidery file and a stencil, and so `fill`
       on the one <path> recolours the whole thing. -->
  <mask id="rows">
    <rect x="0" y="0" width="1024" height="1024" fill="#ffffff"/>
    <g fill="#000000">
      <rect x="503" y="300" width="18" height="424" rx="9"/>
      <rect x="192" y="312" width="292" height="96" rx="48"/>
      <rect x="192" y="464" width="292" height="96" rx="48"/>
      <rect x="192" y="616" width="292" height="96" rx="48"/>
      <rect x="540" y="312" width="292" height="96" rx="48"/>
      <rect x="540" y="464" width="190" height="96" rx="48"/>
      <rect x="540" y="616" width="292" height="96" rx="48"/>
    </g>
  </mask>
  <rect x="100" y="100" width="824" height="824" rx="180" fill="#1d2d3d" mask="url(#rows)"/>
</svg>
