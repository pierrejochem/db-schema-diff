[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "cumo-db-schema-comparer"
version = "0.1.0"
description = "Inventory a master PostgreSQL database and compare 1..n other environments for schema drift"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "cubic-germany" }]
keywords = ["postgresql", "schema", "drift", "liquibase", "ci"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "click>=8.1,<9",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
  "pytest-randomly>=3.15",
  # 4.15 dropped the "postgresql" extra and moved the module to
  # testcontainers.community.postgres; the base package now carries it.
  "testcontainers>=4.15,<5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6",
  "build>=1.2",
]
gui = [
  # Every slint Python release is a pre-release; the pin is explicit so an install cannot
  # silently pick up a different one.
  "slint>=1.18.1b1,<2",
  "keyring>=25,<26",
]
# Kept out of `dev` on purpose: compiling needs a C toolchain, takes minutes, and no test or CI
# job needs it. `make exe` installs it on demand.
exe = [
  # 4.2 is the first release that compiles under Python 3.14, which the GUI requires.
  "nuitka>=4.2,<5",
]

[project.scripts]
cumo-schema-diff = "cumo_schema_comparer.cli:main"
cumo-schema-diff-gui = "cumo_schema_comparer.gui.launcher:main"

[tool.hatch.build.targets.wheel]
# hatchling ships every file inside the package directory, including the .sql query files, the
# Jinja templates and the bundled YAML. A force-include for them would add each one twice and
# fail the build. The `build` CI job installs the wheel and loads a query from it, because a
# packaging mistake here passes every test and fails on first real use.
packages = ["src/cumo_schema_comparer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "S"]
ignore = [
  "ANN401",  # Any is legitimate for raw catalog rows
]

[tool.ruff.lint.per-file-ignores]
# S101 asserts are the point of a test; ANN annotations add noise to them; S105/S106 flag the
# obviously-fake credentials the redaction tests need. S314 flags xml parsing of untrusted input,
# but these tests parse output this tool produced moments earlier, in-process.
"tests/**" = ["S101", "ANN", "S105", "S106", "S314"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["keyring", "slint"]
# Optional (gui extra); absent from the plain dev environment, where mypy runs. Both ship their
# own types, so this is about them not being installed rather than about them being untyped.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
  "integration: requires Docker (or CUMO_SCHEMA_DIFF_TEST_DSN) to run against a real PostgreSQL",
]

[tool.coverage.run]
source = ["cumo_schema_comparer"]
branch = true
# The GUI is an optional extra. slint cannot be installed on 3.11, which the `unit` matrix
# includes, so there every GUI test skips and ~1600 statements would count as uncovered and fail
# the gate. The GUI has its own floor in the `gui` job, which measures it with .coveragerc-gui
# (same settings, without this omit) on an interpreter that can actually import slint.
omit = ["*/cumo_schema_comparer/gui/*"]
