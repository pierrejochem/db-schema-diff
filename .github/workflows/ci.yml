# CI for the code this repo owns: the comparer package, its unit tests, and its integration
# tests against real PostgreSQL containers.
#
# Standalone rather than a reusable workflow: cubic-germany/workflows provides ctsd-maven,
# ctsd-springboot, ctsd-node and ctsd-rn-app, and nothing for Python.
#
# No job needs a secret, so this runs on forks. The integration jobs deliberately have no
# `services:` block — testcontainers starts and stops its own containers, which keeps one
# definition of the fixture topology instead of two that can drift apart.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      - run: ruff format --check .
      - run: ruff check --output-format=github .
      - run: mypy

  unit:
    name: unit-py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      # No Docker needed: the default pytest options deselect the integration marker.
      #
      # The gate is 80 rather than the 85 this job could reach with the integration tests
      # included. db/connect.py and db/introspect.py exist to talk to a real server, so nothing
      # but an integration test can cover them, and mocking a connection here would buy a higher
      # number and test nothing. The `integration` jobs cover them; combined coverage is ~88%.
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    name: integration-pg${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 15 matches local-qa-env. 13 and 17 bracket it, so a catalog change at either
        # end shows up here rather than on somebody's environment.
        postgres: ['13', '15', '17']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      - name: Integration tests
        env:
          DB_SCHEMA_DIFF_TEST_IMAGE: postgres:${{ matrix.postgres }}
        run: pytest -m integration

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e '.[dev]'

      # Run the real CLI against two deliberately-divergent databases and assert it reports
      # the drift. The best end-to-end smoke test available, and it gives a reviewer an actual
      # report to look at on every pull request.
      - name: Compare two divergent databases
        run: python scripts/dogfood.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dogfood-report
          path: |
            build/report.html
            build/report.json
            build/junit.xml
            build/console.txt
          if-no-files-found: ignore

  gui:
    name: gui-py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Slint Python binding requires 3.12; the CLI still supports 3.11.
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Slint's Linux wheel links against system libraries the runner image does not ship; without
      # libinput the very first `import slint` fails at collection, not at a test.
      - run: sudo apt-get update && sudo apt-get install -y libinput10 libxkbcommon0 libfontconfig1 libgl1 libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 xvfb

      # --pre is required: every slint Python release is a pre-release. `dev` is not optional
      # either -- without pytest-asyncio the session tests fail rather than skip.
      - run: pip install --pre -e '.[dev,gui]'

      # A runner has no display, and without one Slint falls back to the Linux framebuffer backend
      # and fails to open /dev/dri. A virtual X server and the software renderer give it a window
      # to instantiate against.
      # The GUI carries its own coverage floor, because the default configuration omits it: the
      # `unit` matrix includes 3.11, where slint cannot be installed and every GUI test skips.
      # Measured at 93.32% when the floor was set.
      - run: >-
          xvfb-run -a
          pytest tests/unit/gui -v
          --cov --cov-config=.coveragerc-gui
          --cov-report=term-missing --cov-fail-under=90

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install build

      - run: python -m build

      # Install the wheel into a clean environment and exercise it. This is the only check
      # that sees what was actually packaged, and it has already earned its place twice:
      # hatchling honours .gitignore, so an unanchored pattern silently dropped a whole
      # subpackage from the wheel while every test in the repo still passed. Running from the
      # source tree cannot catch that.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/db-schema-diff --version
          /tmp/wheel-venv/bin/db-schema-diff compare --help > /dev/null
          /tmp/wheel-venv/bin/python - <<'PY'
          import importlib, pkgutil
          import db_schema_diff

          # Dependencies only the `gui` extra installs. This environment is the CLI's floor
          # (3.11), where slint cannot be installed at all, so a GUI module that imports is a
          # bonus and one that cannot is expected -- but it still has to be *in* the wheel.
          OPTIONAL = {"slint", "keyring"}

          # Every subpackage must import from the installed wheel, not just from the checkout.
          missing = []
          found = set()
          for info in pkgutil.walk_packages(
              db_schema_diff.__path__, f"{db_schema_diff.__name__}."
          ):
              found.add(info.name)
              try:
                  importlib.import_module(info.name)
              except ImportError as exc:
                  if getattr(exc, "name", None) in OPTIONAL:
                      continue
                  missing.append(f"{info.name}: {exc}")
          assert not missing, "modules missing from the wheel:\n" + "\n".join(missing)

          # Named explicitly: a module absent from the wheel is never walked, so the loop above
          # would pass by saying nothing about it.
          for name in ("db_schema_diff.gui.app", "db_schema_diff.gui.__main__"):
              assert name in found, f"{name} is not in the wheel"

          # Package data is loaded at run time, so it fails on first real use, not at import.
          from db_schema_diff.db.introspect import load_query

          for name in ("server", "schemas", "relations", "columns", "constraints", "indexes",
                       "views", "sequences", "routines", "triggers", "types", "extensions",
                       "changelog_locate", "changelog_columns"):
              assert load_query(name).strip(), name

          # The HTML template and the bundled ignore ruleset are package data too.
          from db_schema_diff.diff.ignores import load_default_ignores
          from db_schema_diff.report.html import load_template_source

          assert load_template_source().strip()
          assert load_default_ignores().rules

          # The .slint files are loaded at run time, exactly like the Jinja template.
          import importlib.resources as resources

          ui = resources.files("db_schema_diff.gui").joinpath("ui")
          names = {p.name for p in ui.iterdir()}
          assert names >= {
              "main.slint", "widgets.slint", "config_tab.slint",
              "ignores_tab.slint", "about_tab.slint", "logo-inverse.png",
              "run_tab.slint", "results_tab.slint",
          }, names

          print("wheel is complete: every module imports and all package data loads")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
