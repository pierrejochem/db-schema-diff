# The documentation site: built on every change to it, published to GitHub Pages from main.
#
# `mkdocs build --strict` turns a broken link or a missing page into a failure, so a pull request
# cannot merge a page that points nowhere. Pages itself has to be set to "GitHub Actions" as its
# source once, under Settings -> Pages.
name: Docs

on:
  push:
    branches: [main]
    paths: ['documentation/**', 'overrides/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['documentation/**', 'overrides/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install '.[docs]'

      - run: mkdocs build --strict

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
